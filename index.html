<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coevaluación Profe Ericka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Premiación de aula: cada celular ordena los proyectos de los demás del mejor al peor en cada categoría; la compu de la profe suma y entrega los premios */
:root{
  --ink:#10192e; --panel:#1b2742; --deep:#0b1222; --line:#2e3d60; --chalk:#f3efe4; --mute:#9aa6c2;
  --gold:#e0a81e; --silver:#b9c3d8; --bronze:#c98a5a; --good:#4fd18b; --bad:#ef6a55;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;color:var(--chalk);background:var(--line)}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{background:var(--gold);color:var(--ink)}
.ghost{background:transparent;border:2px solid var(--line)}
.small{padding:6px 12px;font-size:14px;border-radius:9px}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--deep);border:2px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
textarea{width:100%;resize:vertical}
input::placeholder,textarea::placeholder{color:#64708e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.muted{color:var(--mute)}
.hint{color:var(--mute);font-size:14px}
.err{color:var(--bad);min-height:1.4em;font-size:15px;font-weight:700}
.box{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{font-size:22px}
.step{font-family:var(--display);color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:800;font-size:clamp(24px,3.6vw,38px)}
.brand span{color:var(--gold)}
.pinChip{display:flex;align-items:center;gap:10px;background:var(--deep);border:2px solid var(--line);border-radius:12px;padding:6px 14px;color:var(--chalk)}
.pinChip b{font-family:var(--display);font-size:24px;letter-spacing:.12em;color:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
.dot.off{background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-weight:800;padding:10px 18px;border-radius:12px;z-index:50;max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;background:rgba(6,10,20,.92);display:grid;place-items:center;z-index:40;padding:16px;cursor:pointer}
.overlay .inner{text-align:center;display:flex;flex-direction:column;gap:12px}
.bigPin{font-family:var(--display);font-weight:800;font-size:clamp(64px,11vw,130px);letter-spacing:.08em;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.overlay .bigPin{font-size:clamp(90px,22vw,260px)}

/* ---------- profe: armar la sesión ---------- */
.setGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.setGrid{grid-template-columns:1fr}}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:8px;align-items:center;background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.item .num{font-family:var(--display);font-weight:800;color:var(--gold);min-width:2ch;text-align:center}
.item input{flex:1;border:0;background:transparent;padding:6px 4px}
.item .emo{width:3.2em;text-align:center;font-size:20px;flex:none}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.opts label{display:flex;gap:8px;align-items:center;font-weight:700}
.sticky{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}

/* ---------- profe: sesión en vivo ---------- */
.liveHead{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--chalk);color:var(--ink);border-radius:20px;padding:18px 24px}
@media (max-width:700px){.liveHead{grid-template-columns:1fr}}
.liveHead .where{font-size:clamp(17px,2.2vw,24px);font-weight:800}
.liveHead .where b{font-family:var(--display)}
.liveHead .bigPin{color:var(--ink)}
.liveGrid{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.liveGrid{grid-template-columns:1fr}}
.people{display:flex;flex-direction:column;gap:6px;max-height:62vh;overflow-y:auto}
.person{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:2px 8px;align-items:center;background:var(--ink);border-radius:10px;padding:7px 10px;font-size:15px}
.person .dot{grid-row:span 2}
.person .pn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .pg{grid-column:2;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .pp{grid-row:span 2;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.person .pp.done{color:var(--good)}
.person .kick{grid-row:span 2;padding:2px 8px;border-radius:8px;background:transparent;color:var(--mute);font-size:13px}
.person .kick:hover{color:var(--bad)}
.tableWrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);font-weight:900}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
td.proj{font-weight:900;min-width:170px}
.cell b{font-family:var(--display);font-size:18px}
.cell small{display:block;color:var(--mute);font-size:12px}
.cell.p1 b{color:var(--gold)}.cell.p2 b{color:var(--silver)}.cell.p3 b{color:var(--bronze)}
.pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold)}
.status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:4px 12px;font-weight:900;font-size:14px}
.status.open{background:#143326;color:var(--good)}
.status.closed{background:#3d1a16;color:var(--bad)}

/* ---------- premios ---------- */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.award{background:var(--panel);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line);animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.award h3{font-size:22px;display:flex;gap:10px;align-items:center}
.award h3 .e{font-size:30px}
.place{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--ink);border-radius:12px;padding:10px 12px}
.place .m{font-size:28px;line-height:1}
.place b{overflow-wrap:anywhere}
.place small{color:var(--mute);font-weight:800;font-variant-numeric:tabular-nums}
.place.first{background:linear-gradient(90deg,#3a2a06,var(--ink));border:2px solid var(--gold)}
.place.first b{font-family:var(--display);font-size:20px;color:var(--gold)}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.podChk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;color:var(--mute)}
.podChk input{width:18px;height:18px;accent-color:var(--gold)}
.pods{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.podiumCard{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 16px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden;animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.podiumCard.general{border-color:var(--gold);background:linear-gradient(180deg,#3a2a06,var(--panel) 60%);grid-column:1 / -1}
.podiumCard h3{font-size:24px;display:flex;gap:10px;align-items:center;justify-content:center;text-align:center}
.podiumCard h3 .e{font-size:34px}
.podiumCard .sub{text-align:center;color:var(--mute);font-weight:800;font-size:14px}
.stand{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-top:6px}
.spot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.spot .m{font-size:38px;line-height:1}
.spot b{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.spot small{font-size:12px;color:var(--mute);font-weight:700;overflow-wrap:anywhere}
.spot .pts{font-family:var(--display);font-weight:800;font-size:15px;color:var(--chalk)}
.spot .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--ink);transform-origin:bottom;animation:rise .8s cubic-bezier(.2,.9,.3,1.2) both}
.spot.s1 .blk{height:150px;background:var(--gold);box-shadow:0 0 30px rgba(224,168,30,.4)}
.spot.s2 .blk{height:110px;background:var(--silver)}
.spot.s3 .blk{height:80px;background:var(--bronze)}
.spot.s1 b{font-family:var(--display);font-size:18px;color:var(--gold)}
.spot.s3 .blk,.spot.s3 .m,.spot.s3 b{animation-delay:.1s}
.spot.s2 .blk{animation-delay:.45s}.spot.s1 .blk{animation-delay:.8s}
.spot .m,.spot b,.spot small,.spot .pts{animation:popIn .5s both}
.spot.s3 > :not(.blk){animation-delay:.3s}.spot.s2 > :not(.blk){animation-delay:.65s}.spot.s1 > :not(.blk){animation-delay:1s}
.general .spot.s1 .blk{height:180px}.general .spot .m{font-size:46px}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (max-width:560px){.pods{grid-template-columns:1fr}.spot b{font-size:13px}.spot .m{font-size:30px}}
.warnBar{background:#3a2a06;border:2px solid var(--gold);border-radius:14px;padding:12px 16px;font-weight:800;text-align:center}
.wait{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:26px}
.wait .ic{font-size:60px;line-height:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.votes td{vertical-align:top}
.votes ol{margin:0;padding-left:20px;font-size:13px;line-height:1.45}
.votes ol li::marker{font-weight:900;color:var(--gold)}
.votes .vn{font-weight:900;white-space:nowrap}
.votes .vg{display:block;font-size:12px;color:var(--mute);font-weight:700}
.votes tr.profRow td{background:#2a2610}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- celular del estudiante ---------- */
.phone{max-width:560px;margin:0 auto;width:100%;min-height:100vh;min-height:100dvh;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.phone>*{min-width:0}
.hero{border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#24365f 0%,var(--ink) 72%);padding:26px 16px 22px;text-align:center;border:2px solid var(--line)}
.hero .hTop{font-family:var(--display);font-weight:800;letter-spacing:.22em;font-size:14px;color:var(--mute)}
.hero .hMain{font-family:var(--display);font-weight:800;font-size:clamp(32px,10vw,56px);line-height:1;margin-top:6px}
.hero .trophies{font-size:clamp(30px,9vw,44px);margin-top:10px;letter-spacing:.1em}
.hero .hChip{display:inline-block;margin-top:12px;background:var(--gold);color:var(--ink);font-weight:900;letter-spacing:.14em;font-size:14px;padding:5px 14px;border-radius:999px}
.join label{font-size:14px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.join input,.join select{width:100%;font-size:19px;padding:12px}
.join .codeIn{font-family:var(--display);font-weight:800;letter-spacing:.35em;text-align:center;font-size:34px;color:var(--gold);border-color:var(--gold)}
.sHead{display:flex;align-items:center;gap:10px;font-weight:900}
.sHead .grp{font-size:13px;color:var(--mute);font-weight:800;text-align:right}
.prog{display:flex;flex-direction:column;gap:6px}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good)}
.clist{display:flex;flex-direction:column;gap:10px}
.ccard{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;color:var(--chalk)}
.ccard .ce{font-size:30px;line-height:1;flex:none}
.ccard .ct{flex:1;min-width:0}
.ccard .ct b{display:block;font-size:17px}
.ccard .ct small{color:var(--mute);font-weight:800}
.ccard .cs{font-weight:900;color:var(--gold)}
.ccard.done{border-color:var(--good)}
.ccard.done .cs{color:var(--good)}
.catHead{background:var(--chalk);color:var(--ink);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.catHead .ce{font-size:44px;line-height:1}
.catHead small{font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:12px;opacity:.7}
.catHead h2{font-size:24px}
.howto{background:var(--deep);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center}
.howto b{color:var(--gold)}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--chalk);font-size:17px}
.rk .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--deep);color:var(--mute);flex:none;border:2px dashed var(--line)}
.rk .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:800}
.rk.on{border-color:var(--gold);background:#2a2610}
.rk.on .n{background:var(--gold);color:var(--ink);border:0}
.rk.on.r1 .n{background:var(--gold)}.rk.on.r2 .n{background:var(--silver)}.rk.on.r3 .n{background:var(--bronze)}
.rk .x{font-size:13px;color:var(--mute);font-weight:800}
.rk .t small,.proj small,.place small.mem{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--panel);border:2px solid var(--line);padding:8px 12px;font-size:14px}
.tab.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tab.done:not(.on){border-color:var(--good);color:var(--good)}
.profBox{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.person.prof{background:#2a2610;border:2px solid var(--gold)}
.thanks{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:22px}
.thanks .ic{font-size:66px;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
/* ============================================================
   COEVALUACIÓN PROFE ERICKA — premiación entre compañeros
   Cada estudiante ordena los proyectos de los demás del mejor al peor en cada
   categoría (no puede votar por el suyo). La compu de la profe es la "central":
   guarda los votos y calcula los ganadores; Firebase solo lleva los mensajes.
   Puntaje: en cada voto, el 1° recibe 100 y el último 0 (los del medio, en
   proporción). El puntaje de cada proyecto es el promedio de todos sus votos.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkALD5JhwPaACsuUAJ2pfqOoVTPEqm2xI",
  authDomain: "stop-profe-ericka.firebaseapp.com",
  databaseURL: "https://stop-profe-ericka-default-rtdb.firebaseio.com",
  projectId: "stop-profe-ericka",
  storageBucket: "stop-profe-ericka.firebasestorage.app",
  messagingSenderId: "816670586894",
  appId: "1:816670586894:web:1bfc34b4447d9507f6645f"
};
const clean = d => JSON.parse(JSON.stringify(d === undefined ? null : d));
const NET = {
  db: null,
  init(){
    if(typeof firebase === "undefined") return false;
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.database();
    return true;
  },
  room(code){ return this.db.ref("rooms/" + code); },
  onConnected(fn){ this.db.ref(".info/connected").on("value", s => fn(!!s.val())); }
};
class FbConn{
  constructor(code, cid){ this.code = code; this.cid = cid; }
  send(d){ try{ NET.room(this.code).child("inbox/" + this.cid).push(clean(d)); }catch(e){ console.error(e); } }
}

const GAME = "coeval";
const ONLINE_MS = 12000;
const MEDALS = ["🥇","🥈","🥉"];
const DEFAULT_CATS = [
  { emoji:"🏗️", name:"Maqueta más bonita", podium:true },
  { emoji:"💻", name:"Mejor programación", podium:true },
  { emoji:"⚙️", name:"Mejor funcionamiento", podium:false },
  { emoji:"🎤", name:"Mejor presentación", podium:false }
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const ss = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k, v); }catch(e){} }
};
const app = $("app");
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
let audio = null;
function beep(f,ms,type){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.type = type||"sine"; o.frequency.value = f; g.gain.value = .07; o.connect(g); g.connect(audio.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+ms/1000); o.stop(audio.currentTime+ms/1000); }catch(e){} }
function armButton(btn, label, action, armedLabel){
  btn.onclick = () => {
    if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = label; action(); return; }
    btn.dataset.armed = "1"; btn.textContent = armedLabel || "¿Seguro? Toque otra vez";
    setTimeout(() => { if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = label; } }, 3000);
  };
}
const fmt0 = n => String(Math.round(n));
const newId = () => "p" + Math.random().toString(36).slice(2, 8);
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.className = "confetti"; document.body.appendChild(c);
  const ctx = c.getContext("2d"), W = c.width = innerWidth, H2 = c.height = innerHeight;
  const cols = ["#e8553f","#2f8fd6","#e0a81e","#2e9e6b","#f3efe4","#b07ad9"];
  const ps = Array.from({ length:160 }, () => ({ x:W/2 + (Math.random()-.5)*W*.4, y:H2*.3, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:5+Math.random()*6, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)] }));
  const t0 = performance.now();
  const step = now => {
    const t = now - t0; ctx.clearRect(0,0,W,H2);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t/3500); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(t < 3500) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
}

/* ============================================================

const H = { s:null, cfg:null, roomRef:null, token:null, conns:{}, view:"setup" };
const PROF = "profe";
function cfgFresh(){ return { projects:[], cats:JSON.parse(JSON.stringify(DEFAULT_CATS)), maxPer:3, profW:50 }; }
function loadCfg(){
  const c = ls.get("coeval_cfg2", null);
  H.cfg = c && Array.isArray(c.projects) && Array.isArray(c.cats) ? c : cfgFresh();
  if(!H.cfg.maxPer) H.cfg.maxPer = 3;
  if(H.cfg.profW == null) H.cfg.profW = 50;
}
const saveCfg = () => ls.set("coeval_cfg2", H.cfg);
function sFresh(code){ return { code, open:false, projects:[], cats:[], maxPer:3, players:{}, ranks:{}, startedAt:0 }; }
function newCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function hSave(){ const c = JSON.parse(JSON.stringify(H.s)); Object.values(c.players).forEach(p => delete p.seen); ls.set("coeval_host2", c); }
const isOn = p => !!p.seen && (Date.now() - p.seen) < ONLINE_MS;
// los proyectos que le toca ordenar a un estudiante: todos menos el suyo
const toRank = p => H.s.projects.filter(x => x.id !== p.group).map(x => x.id);
const catsDone = cid => { const r = H.s.ranks[cid] || {}; return H.s.cats.filter((_,i) => Array.isArray(r[i])).length; };
function memberCount(pid, except){ return Object.entries(H.s.players).filter(([cid,p]) => cid !== except && p.group === pid).length; }
function membersMap(){ const m = {}; H.s.projects.forEach(pr => m[pr.id] = memberCount(pr.id)); return m; }
// nombres de los integrantes de cada proyecto (los que eligieron ese grupo al entrar)
const namesOf = pid => Object.values(H.s.players).filter(p => p.group === pid).map(p => p.name);
function namesMap(){ const m = {}; H.s.projects.forEach(pr => m[pr.id] = namesOf(pr.id)); return m; }

function teacherInit(){
  loadCfg();
  const saved = ls.get("coeval_host2", null);
  H.s = saved && saved.code ? saved : sFresh(newCode());
  if(H.s.startedAt) H.view = "live";
  hSave(); hStartNet(); hRender();
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ const o = $("ovPin"); if(o) o.remove(); } });
  setInterval(hBroadcast, 8000);
  setInterval(() => { if(H.view === "live") hRenderPeople(); }, 4000);
}
function hLink(){ return location.host + location.pathname.replace(/index\.html$/,""); }
function hStartNet(){
  if(!NET.init()){ toast("No se pudo cargar Firebase. Revise el internet."); return; }
  if(!H.token){ H.token = ls.get("coeval_token", null) || (Math.random().toString(36).slice(2) + Date.now().toString(36)); ls.set("coeval_token", H.token); }
  if(H.roomRef){ try{ H.roomRef.child("toHost").off(); }catch(e){} }
  const code = H.s.code, room = NET.room(code);
  room.child("host").once("value").then(snap => {
    const h = snap.val();
    if(h && h.token !== H.token){ H.s.code = newCode(); hSave(); hStartNet(); hRender(); return; } // PIN ocupado por otro juego
    H.roomRef = room; H.conns = {};
    room.child("host").set({ token:H.token, game:GAME, t:firebase.database.ServerValue.TIMESTAMP });
    room.child("host").onDisconnect().remove();
    room.child("toHost").on("child_added", s2 => {
      const m = s2.val(); s2.ref.remove();
      if(!m || !m.cid || !m.d) return;
      const cid = String(m.cid).replace(/[^a-z0-9]/gi,"").slice(0,40); if(!cid) return;
      hOnData(cid, m.d);
    });
    hBroadcast(); hSetNet(true);
  }).catch(err => { console.error(err); hSetNet(false, "Firebase rechazó la conexión. Revise las reglas de la base de datos."); });
  NET.onConnected(ok => hSetNet(ok));
}
function hSetNet(ok, msg){ H.netOk = ok; H.netMsg = msg || (ok ? "" : "Sin conexión a internet; reintentando…"); document.querySelectorAll(".netDot").forEach(d => d.classList.toggle("off", !ok)); document.querySelectorAll(".netMsg").forEach(d => d.textContent = H.netMsg); }
function connFor(cid){ if(!H.conns[cid]) H.conns[cid] = new FbConn(H.s.code, cid); return H.conns[cid]; }

function hStateMsg(){
  const s = H.s;
  return { t:"state", game:GAME, open:!!s.open && !!s.startedAt, projects:s.projects, cats:s.cats, maxPer:s.maxPer || 3, members:membersMap(), names:namesMap() };
}
function hBroadcast(){ if(!H.roomRef) return; const m = hStateMsg(); m.hb = Date.now(); try{ H.roomRef.child("state").set(clean(m)); }catch(e){ console.error(e); } }

function hOnData(cid, d){
  if(!d || typeof d !== "object") return;
  const s = H.s, c = connFor(cid);
  if(d.t === "join"){
    const name = String(d.name||"").replace(/\s+/g," ").trim().slice(0,52);
    if(!name){ c.send({ t:"rejected", msg:"Escriba su nombre para entrar." }); return; }
    const group = s.projects.some(x => x.id === d.group) ? d.group : "";
    // ¿es alguien que vuelve? (mismo celular, o mismo nombre desconectado): no cuenta como integrante nuevo
    const back = s.players[cid] ? cid : (Object.entries(s.players).find(([,x]) => x.name.toLowerCase() === name.toLowerCase() && !isOn(x)) || [])[0];
    if(group && memberCount(group, back) >= (s.maxPer || 3)){
      const pr = s.projects.find(x => x.id === group);
      c.send({ t:"rejected", msg:"«" + pr.name + "» ya tiene " + (s.maxPer || 3) + " integrantes. Revise cuál es su proyecto o avise a la profe." });
      return;
    }
    let p = s.players[cid];
    if(!p && back){ p = s.players[back]; delete s.players[back]; s.players[cid] = p; if(s.ranks[back]){ s.ranks[cid] = s.ranks[back]; delete s.ranks[back]; } }
    if(!p){
      const taken = new Set(Object.values(s.players).map(x => x.name.toLowerCase()));
      let nm = name, k = 2; while(taken.has(nm.toLowerCase())) nm = name + " " + (k++);
      p = s.players[cid] = { name:nm, group };
      beep(700,80);
    }
    if(group !== (p.group || "")){ p.group = group; delete s.ranks[cid]; } // si cambió de grupo, vuelve a votar
    p.seen = Date.now(); p.lastAt = Date.now();
    hSave();
    c.send({ t:"welcome", name:p.name, group:p.group || "", done:s.ranks[cid] || {} });
    hRenderPeople(); hBroadcast();
    return;
  }
  const p = s.players[cid];
  if(!p){ c.send({ t:"kicked" }); return; }
  p.seen = Date.now(); p.lastAt = Date.now();
  if(d.t === "ping") return;
  if(d.t === "rank"){
    if(!s.open){ c.send({ t:"closed" }); return; }
    const ci = +d.ci, want = toRank(p);
    if(!(ci >= 0 && ci < s.cats.length) || !Array.isArray(d.order)) return;
    const order = d.order.map(String);
    // tiene que ser exactamente la lista de proyectos que le tocan, sin repetir
    if(order.length !== want.length || new Set(order).size !== order.length || order.some(id => !want.includes(id))) return;
    (s.ranks[cid] = s.ranks[cid] || {})[ci] = order;
    hSave();
    c.send({ t:"saved", ci, order });
    hRenderPeople(); hRenderResults();
  }
}
function hKick(cid){ connFor(cid).send({ t:"kicked" }); delete H.s.players[cid]; delete H.s.ranks[cid]; hSave(); hRenderPeople(); hRenderResults(); hBroadcast(); }

/* --- puntajes y premios --- */
function catResults(ci){
  const s = H.s, w = s.profW ?? 50; // porcentaje que pesa el voto de la profe (0 = como un estudiante más)
  return s.projects.map(pr => {
    let sum = 0, votes = 0, firsts = 0, prof = null;
    Object.entries(s.ranks).forEach(([cid, r]) => {
      const order = r[ci]; if(!Array.isArray(order)) return;
      const i = order.indexOf(pr.id); if(i < 0) return;
      const m = order.length, pts = m > 1 ? (m - 1 - i) / (m - 1) * 100 : 100;
      if(cid === PROF && w > 0){ prof = pts; return; }
      sum += pts; votes++; if(i === 0) firsts++;
    });
    const stu = votes ? sum / votes : null;
    const score = stu != null && prof != null ? stu * (1 - w / 100) + prof * (w / 100) : stu != null ? stu : (prof != null ? prof : 0);
    return { id:pr.id, name:pr.name, score, votes:votes + (prof != null ? 1 : 0), firsts, stu, prof };
  }).sort((a,b) => (b.votes ? 1 : 0) - (a.votes ? 1 : 0) || b.score - a.score || b.firsts - a.firsts || a.name.localeCompare(b.name));
}
function allResults(){
  const s = H.s, per = s.cats.map((_,ci) => catResults(ci));
  const rows = s.projects.map(pr => {
    const cells = per.map(list => { const k = list.findIndex(x => x.id === pr.id); return { ...list[k], place:list[k].votes ? k + 1 : 0 }; });
    const voted = cells.filter(x => x.votes);
    return { id:pr.id, name:pr.name, cells, total:voted.reduce((a,x) => a + x.score, 0), any:voted.length > 0 }; // suma de todos los rubros
  }).sort((a,b) => (b.any ? 1 : 0) - (a.any ? 1 : 0) || b.total - a.total || a.name.localeCompare(b.name));
  return { per, rows };
}
function csvDownload(){
  const s = H.s, { per, rows } = allResults(), q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const pname = id => (s.projects.find(x => x.id === id) || {}).name || "";
  const lines = [];
  lines.push([q("RESULTADO GENERAL")].join(";"));
  lines.push(["Puesto", "Proyecto"].concat(s.cats.map(c => c.name + " (puntaje)")).concat(["Puntaje general (suma, de " + s.cats.length * 100 + ")"]).map(q).join(";"));
  rows.forEach((r,k) => lines.push([k + 1, r.name].concat(r.cells.map(x => x.votes ? fmt0(x.score) : "")).concat([r.any ? fmt0(r.total) : ""]).map(q).join(";")));
  lines.push("");
  s.cats.forEach((c,ci) => {
    lines.push([q("CATEGORÍA: " + c.name)].join(";"));
    lines.push(["Puesto", "Proyecto", "Puntaje (0-100)", "Votos", "Veces en 1°"].map(q).join(";"));
    per[ci].forEach((x,k) => lines.push([x.votes ? k + 1 : "", x.name, x.votes ? fmt0(x.score) : "", x.votes, x.firsts].map(q).join(";")));
    lines.push("");
  });
  lines.push([q("VOTOS DE CADA ESTUDIANTE (del mejor al peor)")].join(";"));
  lines.push(["Estudiante", "Su proyecto", "Categoría", "Orden"].map(q).join(";"));
  Object.entries(s.players).forEach(([cid,p]) => s.cats.forEach((c,ci) => { const o = (s.ranks[cid] || {})[ci]; if(o) lines.push([p.name, pname(p.group), c.name, o.map((id,k) => (k+1) + ". " + pname(id)).join(" | ")].map(q).join(";")); }));
  s.cats.forEach((c,ci) => { const o = (s.ranks[PROF] || {})[ci]; if(o) lines.push(["Profe", "", c.name, o.map((id,k) => (k+1) + ". " + pname(id)).join(" | ")].map(q).join(";")); });
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "coevaluacion-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Descargando el archivo para Excel…");
}

// la profe ordena TODOS los proyectos en cada categoría
function hProfVote(ci){
  const s = H.s, list = s.projects, mine = s.ranks[PROF] = s.ranks[PROF] || {};
  if(ci == null || ci < 0 || ci >= s.cats.length){ ci = s.cats.findIndex((_,k) => !Array.isArray(mine[k])); if(ci < 0) ci = 0; }
  H.profCi = ci;
  const saved = mine[ci];
  let order = Array.isArray(saved) && saved.length === list.length && saved.every(id => list.some(p => p.id === id)) ? saved.slice() : [];
  const draw = () => {
    const c = s.cats[ci], complete = order.length === list.length;
    const byOrder = order.map(id => list.find(p => p.id === id)).concat(list.filter(p => !order.includes(p.id)));
    app.innerHTML = `<div class="wrap">
      ${hTopBar('<button class="ghost small" id="backLive">← Volver a los resultados</button>')}
      <div class="profBox">
        <h2 style="font-size:28px">🧑‍🏫 Voto de la profe</h2>
        <div class="tabs" id="tabs">${s.cats.map((k,i) => `<button class="tab ${i === ci ? "on" : ""} ${Array.isArray(mine[i]) ? "done" : ""}" data-t="${i}">${esc(k.emoji)} ${esc(k.name)}</button>`).join("")}</div>
        <div class="catHead"><span class="ce">${esc(c.emoji)}</span><div><small>Categoría ${ci+1} de ${s.cats.length}</small><h2>${esc(c.name)}</h2></div></div>
        <p class="howto">${complete ? "✓ ¡Listo! Revise el orden y toque <b>Guardar</b>." : `Toque los proyectos <b>del MEJOR al PEOR</b>. Ahora elija el <b>${order.length + 1}°</b> lugar.`}</p>
        <div class="rank" id="rankList">${byOrder.map(p => { const k = order.indexOf(p.id), nm = namesOf(p.id);
          return `<button class="rk ${k >= 0 ? "on r" + (k+1) : ""}" data-p="${esc(p.id)}"><span class="n">${k >= 0 ? k + 1 : ""}</span><span class="t">${esc(p.name)}${nm.length ? `<small>${esc(nm.join(", "))}</small>` : ""}</span>${k >= 0 && !complete ? '<span class="x">quitar</span>' : ""}</button>`; }).join("")}</div>
        <div class="row"><button class="ghost small" id="reset" ${order.length ? "" : "disabled"}>↺ Empezar de nuevo</button><span class="spacer"></span>
          <button class="go" id="save" ${complete ? "" : "disabled"}>Guardar ✓</button></div>
        <p class="hint">${(s.profW ?? 50) ? "Su voto vale el " + (s.profW ?? 50) + " % del puntaje de cada categoría." : "Su voto cuenta como el de un estudiante más."} Puede cambiarlo en <b>Editar proyectos y categorías</b>.</p>
      </div></div>`;
    hWirePin();
    $("backLive").onclick = () => { H.view = "live"; hRender(); };
    $("tabs").onclick = e => { const b = e.target.closest("button[data-t]"); if(b) hProfVote(+b.dataset.t); };
    $("rankList").onclick = e => {
      const b = e.target.closest("button[data-p]"); if(!b) return;
      const id = b.dataset.p, k = order.indexOf(id);
      if(k >= 0) order.splice(k);
      else { order.push(id); if(order.length === list.length - 1) order.push(list.find(p => !order.includes(p.id)).id); }
      draw();
    };
    $("reset").onclick = () => { order = []; draw(); };
    $("save").onclick = () => {
      mine[ci] = order.slice(); hSave(); beep(880,90); setTimeout(() => beep(1175,120), 90);
      const next = s.cats.findIndex((_,k) => !Array.isArray(mine[k]));
      toast(next < 0 ? "¡Listo! Votó en todas las categorías." : "Guardado. Sigue: " + s.cats[next].name);
      if(next < 0){ H.view = "live"; hRender(); } else hProfVote(next);
    };
  };
  draw();
}

}

const S = { code:"", name:"", group:"", cid:"", joined:false, st:null, done:{}, pinOk:false, attempts:0, cur:-1, order:[] };

function studentInit(){

function sGroupOptions(st){

// el PIN es correcto pero la profe todavía no abre la votación: esperar y entrar solo cuando la abra
function sWaitOpen(){
  app.innerHTML = `<div class="phone">${sHero()}
    <div class="box wait"><div class="ic">⏳</div><h2>Esperando a la profe</h2>
      <p class="muted">El PIN <b style="color:var(--gold)">${esc(S.code)}</b> es correcto. Apenas la profe abra la votación, esta pantalla sigue sola.</p>
      <button class="ghost small" id="chPin2">Cambiar PIN</button></div></div>`;
  $("chPin2").onclick = () => { clearTimeout(S.waitT); S.pinOk = false; sJoinView(); };
  clearTimeout(S.waitT);
  S.waitT = setTimeout(function again(){
    sCheckPin(S.code, st => { if(st.open){ S.st = st; S.pinOk = true; beep(880,90); sJoinView(); } else S.waitT = setTimeout(again, 3000); },
      () => { S.waitT = setTimeout(again, 4000); });
  }, 3000);

// mientras elige su grupo, mantener al día cuáles están llenos
function sRefreshGroups(){
  const sel = $("inGroup"), st = S.st || {}; if(!sel) return;
  [...sel.options].forEach(o => {
    const pr = (st.projects || []).find(p => p.id === o.value); if(!pr) return;
    const n = (st.members || {})[pr.id] || 0, full = n >= (st.maxPer || 3) && o.value !== sel.value;
    o.disabled = full; o.textContent = pr.name + " " + (full ? "(lleno)" : "(" + n + " de " + (st.maxPer || 3) + ")");
  });

// revisa que el PIN sea de una coevaluación abierta y trae la lista de proyectos
function sCheckPin(code, ok, fail){
  if(!NET.init()){ fail("No se pudo cargar la página. Revise el internet."); return; }
  const t = setTimeout(() => fail("Problema de conexión a internet. Intente de nuevo."), 15000);
  const room = NET.room(code);
  room.child("host").once("value").then(snap => {
    const h = snap.val();
    if(!h){ clearTimeout(t); fail("No hay ninguna sesión con el PIN " + code + ". Revíselo o pida a la profe que la abra."); return; }
    if(h.game !== GAME){ clearTimeout(t); fail("El PIN " + code + " es de un juego, no de la coevaluación. Revise el PIN."); return; }
    return room.child("state").once("value").then(s2 => {
      clearTimeout(t);
      const st = s2.val();
      if(!st){ fail("La sesión todavía se está preparando. Espere un momento e intente de nuevo."); return; }
      ok(st);
    });
  }).catch(e => { clearTimeout(t); console.error(e); fail("No se pudo revisar el PIN. Avise a la profe."); });
}
function sStart(){
  if(!NET.init()){ sJoinView("No se pudo cargar la página. Revise el internet."); return; }
  if(S.room){ try{ S.room.child("state").off(); S.room.child("inbox/" + S.cid).off(); }catch(e){} }
  S.room = NET.room(S.code);
  S.room.child("inbox/" + S.cid).on("child_added", s2 => { const d = s2.val(); s2.ref.remove(); S.lastHeard = Date.now(); sOnData(d); });
  S.room.child("state").on("value", s2 => { const d = s2.val(); if(d){ S.lastHeard = Date.now(); const was = S.st; S.st = d; if(S.joined) sOnState(d, was); else sRefreshGroups(); } });
  sConnect();
}
function sConnect(){
  if(!S.room) return;
  S.attempts++;
  sSend({ t:"join", name:S.name, cid:S.cid, group:S.group });
  clearTimeout(S.openT);
  S.openT = setTimeout(() => {
    if(S.joined) return;
    if(S.attempts >= 4){ S.pinOk = false; sJoinView("La compu de la profe no responde. Revise el PIN y que la profe tenga la sesión abierta."); return; }
    sConnect();
  }, 6000);
}
function sSend(m){ if(!S.room) return; try{ S.room.child("toHost").push(clean({ cid:S.cid, d:m })); }catch(e){ console.error(e); } }
function sOnData(d){
  if(!d || typeof d !== "object") return;
  if(d.t === "welcome"){ clearTimeout(S.openT); const first = !S.joined; S.joined = true; S.name = d.name; S.group = d.group || ""; S.done = d.done || {}; if(first) sNext(); return; }
  if(d.t === "rejected"){ S.pinOk = true; S.group = ""; clearTimeout(S.openT); sJoinView(d.msg); return; }
  if(d.t === "kicked"){ S.joined = false; S.pinOk = false; try{ S.room.child("state").off(); S.room.child("inbox/" + S.cid).off(); }catch(e){} S.room = null; sJoinView("La profe lo sacó de la sesión."); return; }
  if(d.t === "saved"){
    S.done[d.ci] = d.order; clearTimeout(S.saveT);
    if(S.pendingCi === d.ci){ S.pendingCi = null; beep(880,90); setTimeout(() => beep(1175,120), 90); toast("¡Voto guardado!"); sNext(); }
    return;
  }
  if(d.t === "closed"){ toast("La profe cerró la votación."); sMenu(); }
}
function sOnState(d, was){
  const sig = x => x ? JSON.stringify([x.projects, x.cats, x.open]) : "";
  if(sig(d) !== sig(was)){ if(!d.open || !$("rankView")) sMenu(); }
}
const sMine = () => ((S.st && S.st.projects) || []).filter(p => p.id !== S.group);
function sHead(){
  const g = ((S.st && S.st.projects) || []).find(p => p.id === S.group);

}
// va a la siguiente categoría que falte; si ya votó todas, muestra el menú

  app.innerHTML = `<div class="phone" id="menuView">${sHead()}
    ${n >= cats.length && cats.length ? `<div class="box thanks"><div class="ic">🎉</div><h2>¡Votó en todas las categorías!</h2><p class="muted">Gracias. Si quiere, todavía puede cambiar algún voto.</p></div>` : ""}
    <div class="prog"><div class="row"><b>Categorías</b><span class="spacer"></span><b>${n} de ${cats.length}</b></div><div class="pbar"><i style="width:${cats.length ? n / cats.length * 100 : 0}%"></i></div></div>
    <div class="clist">${cats.map((c,k) => `<button class="ccard ${S.done[k] ? "done" : ""}" data-c="${k}">
      <span class="ce">${esc(c.emoji)}</span><span class="ct"><b>${esc(c.name)}</b><small>${S.done[k] ? "Votado · toque para cambiar" : "Pendiente"}</small></span>
      <span class="cs">${S.done[k] ? "✓" : "Votar →"}</span></button>`).join("")}</div>
    <p class="hint" style="text-align:center">Vote con honestidad: piense en lo que vio en cada presentación, no en quiénes son sus amigos.</p>
  </div>`;
  app.querySelector(".clist").onclick = e => { const b = e.target.closest("button[data-c]"); if(b) sRank(+b.dataset.c); };
}
// ordenar: se tocan los proyectos del mejor al peor; el último se pone solo
function sRank(ci){
  const st = S.st || {}, cats = st.cats || [], c = cats[ci]; if(!c) return;
  const list = sMine();
  S.cur = ci;
  const prev = Array.isArray(S.done[ci]) && S.done[ci].length === list.length && S.done[ci].every(id => list.some(p => p.id === id)) ? S.done[ci].slice() : [];
  S.order = prev;
  const draw = () => {
    const complete = S.order.length === list.length;
    const byOrder = S.order.map(id => list.find(p => p.id === id)).concat(list.filter(p => !S.order.includes(p.id)));
    app.innerHTML = `<div class="phone" id="rankView">${sHead()}
      <div class="catHead"><span class="ce">${esc(c.emoji)}</span><div><small>Categoría ${ci+1} de ${cats.length}</small><h2>${esc(c.name)}</h2></div></div>
      <p class="howto">${complete ? "✓ ¡Listo! Revise su orden y toque <b>Guardar</b>." : `Toque los proyectos <b>del MEJOR al PEOR</b>. Ahora elija el <b>${S.order.length + 1}°</b> lugar.`}</p>
      <div class="rank" id="rankList">${byOrder.map(p => { const k = S.order.indexOf(p.id);
        const nm = ((S.st && S.st.names) || {})[p.id] || [];
        return `<button class="rk ${k >= 0 ? "on r" + (k+1) : ""}" data-p="${esc(p.id)}"><span class="n">${k >= 0 ? k + 1 : ""}</span><span class="t">${esc(p.name)}${nm.length ? `<small>${esc(nm.join(", "))}</small>` : ""}</span>${k >= 0 && !complete ? '<span class="x">quitar</span>' : ""}</button>`; }).join("")}</div>
      <div class="row"><button class="ghost" id="back">← Categorías</button><button class="ghost small" id="reset" ${S.order.length ? "" : "disabled"}>↺ Empezar de nuevo</button><span class="spacer"></span>
        <button class="go" id="save" ${complete ? "" : "disabled"} style="font-size:18px">Guardar ✓</button></div>
    </div>`;
    $("rankList").onclick = e => {
      const b = e.target.closest("button[data-p]"); if(!b) return;
      const id = b.dataset.p, k = S.order.indexOf(id);
      if(k >= 0){ S.order.splice(k); beep(300,50); }   // tocar uno ya elegido lo quita (y los que venían después)
      else { S.order.push(id); beep(520 + S.order.length * 60, 60); if(S.order.length === list.length - 1) S.order.push(list.find(p => !S.order.includes(p.id)).id); }
      draw();
    };
    $("back").onclick = sMenu;
    $("reset").onclick = () => { S.order = []; draw(); };
    $("save").onclick = () => {
      const order = S.order.slice();
      S.pendingCi = ci; $("save").disabled = true; $("save").textContent = "Guardando…";
      const go = () => sSend({ t:"rank", ci, order });
      go(); clearTimeout(S.saveT);
      S.saveT = setTimeout(function again(){ if(S.pendingCi === ci){ go(); S.saveT = setTimeout(again, 4000); } }, 4000);
    };
  };
  draw(); window.scrollTo(0,0);
}

/* ---------- arranque ---------- */
if(typeof firebase === "undefined"){
  app.innerHTML = '<div class="phone"><div class="box"><h1>Coevaluación</h1><p>No se pudo cargar la página. Revise la conexión a internet y recargue.</p></div></div>';
} else if(new URLSearchParams(location.search).has("profe")){
  teacherInit();
} else {
  studentInit();
}
</script>
